<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael | Developer Portfolio</title>
    <!-- Favicon: Using the Home Data URL trick -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    
    <style>
        :root {
            --bg-color: #121212;
            --accent-color: #ff00ff; /* The neon purple from the image */
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            padding: 40px;
        }

        /* --- Header & Nav --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .styled-name {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .styled-name span {
            color: var(--accent-color);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
            margin: 0;
            padding: 0;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* --- Hero Section --- */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 80px;
        }

        .hero-text {
            max-width: 500px;
        }

        .hero-text h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .hero-text h1 {
            font-size: 4rem;
            margin: 0;
            line-height: 1.1;
        }

        .hero-text h3 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-top: 10px;
        }

        .hero-text p {
            color: var(--text-dim);
            line-height: 1.6;
            margin: 20px 0;
        }

        /* --- The Glowing Image --- */
        .profile-img-container {
            position: relative;
            width: 350px;
            height: 350px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
            box-shadow: 0 0 30px var(--accent-color), inset 0 0 20px var(--accent-color);
        }

        /* --- Buttons & Links --- */
        .btn-cv {
            display: inline-block;
            padding: 10px 25px;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-cv:hover {
            background-color: var(--accent-color);
            color: #000;
            box-shadow: 0 0 15px var(--accent-color);
        }

        .social-icons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .social-icons img {
            filter: invert(1); /* Makes black icons white to match the theme */
            transition: transform 0.3s;
        }

        .social-icons img:hover {
            transform: scale(1.2);
        }

        /* Responsive Mobile View */
        @media (max-width: 768px) {
            .hero {
                flex-direction: column-reverse;
                text-align: center;
            }
            .profile-img-container {
                width: 250px;
                height: 250px;
                margin-bottom: 40px;
            }
            nav {
                display: none; /* Simplification for example */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="styled-name">Michael</div>
        <nav>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h2>Hello, I'm</h2>
            <h1>Michael</h1>
            <h3>And I'm a Computer Science Student</h3>
            <p>
                I'm passionate about business and programming.
                I usually program in Java but will learn anything fast.
            </p>
            

            <div class="social-icons">
                <a href="https://github.com/Lil-Cyb" target="_blank">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" width="30" height="30" alt="GitHub">
                </a>
                
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/archlinux/archlinux-original.svg" width="30" height="30" alt="Arch">

                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/java/java-original.svg" width="30" height="30" alt="Java">

                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/csharp/csharp-original.svg" width="30" height="30" alt="C#"/>
          
            </div>
        </div>

        <div class="profile-img-container">
            <!-- Replace with your actual photo URL -->
            <img src="profile-picture.png" alt="Profile Image" class="profile-img">
        </div>
    </section>
</div>

</body>
</html>
